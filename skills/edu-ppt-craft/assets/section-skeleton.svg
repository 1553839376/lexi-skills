<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Microsoft YaHei" lang="zh-CN" data-pptx-page-role="section">
  <rect id="ch-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FAF6EE"/>
  <!-- 左半整图：出图时换回
       <image id="ch-img" href="../images/xxx.jpg" x="0" y="0" width="640" height="720"
              preserveAspectRatio="xMidYMid meet"/> -->
  <g id="ch-photo" data-pptx-role="decoration" data-pptx-bounds="0 0 640 720">
    <rect x="0" y="0" width="640" height="720" fill="#EFE8DA"/>
    <rect x="16" y="16" width="608" height="688" fill="none" stroke="#DCCDB2" stroke-width="1.5" stroke-dasharray="8 6"/>
    <text x="320" y="352" font-size="22" fill="#B8A98C" text-anchor="middle">左侧整图 640×720</text>
    <text x="320" y="384" font-size="22" fill="#C9BBA0" text-anchor="middle">preserveAspectRatio="xMidYMid meet"</text>
  </g>
  <rect id="ch-bar" data-pptx-role="decoration" x="632" y="0" width="8" height="720" fill="#8FD0CB"/>
  <g id="ch-stamp" data-pptx-bounds="32 612 88 92">
    <circle cx="76" cy="656" r="42" fill="#FAF6EE" fill-opacity="0.94"/>
    <text x="76" y="668" font-size="32" font-weight="bold" fill="#1E3A38" text-anchor="middle">03</text>
  </g>
  <rect id="ch-rule" data-pptx-role="decoration" x="700" y="180" width="46" height="4" fill="#8FD0CB"/>
  <g id="ch-kicker" data-pptx-bounds="762 166 320 45">
    <text x="762" y="196" font-size="26" fill="#2F8B84">第几部分</text>
  </g>
  <g id="ch-title" data-pptx-bounds="700 259 496 144">
    <text x="700" y="310" font-size="44" font-weight="bold" fill="#1E3A38">章节标题第一行<tspan x="700" dy="70">章节标题第二行</tspan></text>
  </g>
  <g id="ch-body" data-pptx-bounds="700 440 496 133">
    <text x="700" y="470" font-size="26" fill="#5C716E">三行简介，每行<tspan x="700" dy="44">用 dy=44 手动换行，</tspan><tspan x="700" dy="44">不要靠自动换行。</tspan></text>
  </g>
  <rect id="ch-note-rule" data-pptx-role="decoration" x="700" y="600" width="56" height="2" fill="#E3D3B4"/>
  <g id="ch-note" data-pptx-bounds="700 609 520 40">
    <text x="700" y="636" font-size="22" fill="#8A9B96">底部一句备注。</text>
  </g>
</svg>
